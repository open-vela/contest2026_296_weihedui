<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- 门开图标 -->
  <defs>
    <style>
      .door-frame { fill: none; stroke: #00b4d8; stroke-width: 3; stroke-linejoin: round; }
      .door-panel { fill: #00b4d8; opacity: 0.8; }
    </style>
  </defs>

  <!-- 门框 -->
  <rect class="door-frame" x="8" y="4" width="32" height="40" rx="2" ry="2"/>

  <!-- 门板（透视效果） -->
  <polygon class="door-panel" points="12,8 24,12 24,44 12,40"/>

  <!-- 门把手 -->
  <circle cx="20" cy="28" r="2" fill="#ffffff"/>
</svg>
