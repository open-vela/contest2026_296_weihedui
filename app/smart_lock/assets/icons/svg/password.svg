<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- 密码图标 -->
  <defs>
    <style>
      .key { fill: #ffffff; }
      .key-stroke { fill: none; stroke: #ffffff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- 钥匙头部 -->
  <circle class="key" cx="10" cy="16" r="6"/>

  <!-- 钥匙孔 -->
  <circle cx="10" cy="16" r="2" fill="#000000"/>

  <!-- 钥匙柄 -->
  <rect class="key" x="16" y="14" width="12" height="4" rx="1" ry="1"/>

  <!-- 钥匙齿 -->
  <rect class="key" x="24" y="18" width="2" height="4"/>
  <rect class="key" x="28" y="18" width="2" height="4"/>
</svg>
