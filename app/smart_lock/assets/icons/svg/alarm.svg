<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- 报警图标 -->
  <defs>
    <style>
      .bell { fill: #ff0000; }
      .bell-stroke { fill: none; stroke: #ff0000; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .bell-base { fill: #ff0000; }
    </style>
  </defs>

  <!-- 铃铛主体 -->
  <path class="bell" d="M16 4 C10 4 6 10 6 16 L6 20 L4 22 L28 22 L26 20 L26 16 C26 10 22 4 16 4 Z"/>

  <!-- 铃铛顶部 -->
  <circle cx="16" cy="4" r="2" fill="#ff0000"/>

  <!-- 铃铛底部 -->
  <rect class="bell-base" x="10" y="22" width="12" height="4" rx="2" ry="2"/>

  <!-- 铃铛中心 -->
  <circle cx="16" cy="28" r="2" fill="#ff0000"/>
</svg>
