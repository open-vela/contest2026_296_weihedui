<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- 解锁图标 -->
  <defs>
    <style>
      .lock-body { fill: #ffd700; }
      .lock-hole { fill: #000000; }
      .lock-shackle { fill: none; stroke: #ffd700; stroke-width: 3; stroke-linecap: round; }
    </style>
  </defs>

  <!-- 锁身 -->
  <rect class="lock-body" x="10" y="22" width="28" height="20" rx="4" ry="4"/>

  <!-- 锁孔 -->
  <circle class="lock-hole" cx="24" cy="32" r="4"/>

  <!-- 锁梁（打开状态） -->
  <path class="lock-shackle" d="M16 22 V16 C16 10 32 10 32 16"/>
</svg>
